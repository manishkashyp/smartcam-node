plugins {
    id 'com.android.application'
}

android {
    namespace 'in.luxture.smartcam'
    compileSdk 34

    defaultConfig {
        applicationId "in.luxture.smartcam"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
